<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580">
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <filter id="sh" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.2" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#5b9bd5"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#548235"/>
    </marker>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: #000; }
      .tb { font-family: Arial, Helvetica, sans-serif; fill: #2e75b6; font-size: 10px; }
      .halo { stroke: #fff; stroke-width: 3px; paint-order: stroke; }
      .tg { font-family: Arial, Helvetica, sans-serif; fill: #548235; font-size: 10px; }
    </style>
  </defs>

  <circle cx="175" cy="24" r="12" fill="#5b9bd5"/>
  <line x1="175" y1="36" x2="175" y2="62" stroke="#5b9bd5" stroke-width="2.5" marker-end="url(#ab)"/>

  <rect x="80" y="64" width="190" height="46" fill="#fff" stroke="#5b9bd5" stroke-width="2.5" filter="url(#sh)"/>
  <text class="t" x="175" y="93" text-anchor="middle" font-size="15">DISABLED</text>

  <rect x="80" y="210" width="190" height="46" fill="#fff" stroke="#5b9bd5" stroke-width="2.5" filter="url(#sh)"/>
  <text class="t" x="175" y="239" text-anchor="middle" font-size="15">EXPIRED</text>

  <rect x="80" y="390" width="190" height="52" fill="#fff" stroke="#5b9bd5" stroke-width="2.5" filter="url(#sh)"/>
  <text class="t" x="175" y="412" text-anchor="middle" font-size="15">CURRENT</text>
  <text class="t" x="175" y="430" text-anchor="middle" font-size="11">Selectable=1</text>

  <line x1="175" y1="110" x2="175" y2="208" stroke="#5b9bd5" stroke-width="2.5" marker-end="url(#ab)"/>
  <text class="tb" x="186" y="164">Link up &amp; admin up</text>
  <line x1="158" y1="210" x2="158" y2="112" stroke="#5b9bd5" stroke-width="2.5" marker-end="url(#ab)"/>
  <text class="tb" x="68" y="156">Link down or</text>
  <text class="tb" x="68" y="168">admin down</text>

  <line x1="175" y1="256" x2="175" y2="388" stroke="#5b9bd5" stroke-width="2.5" marker-end="url(#ab)"/>
  <text class="tb" x="186" y="326">received LACPDU</text>
  <line x1="158" y1="390" x2="158" y2="258" stroke="#5b9bd5" stroke-width="2.5" marker-end="url(#ab)"/>
  <text class="tb" x="68" y="318">current_while</text>
  <text class="tb" x="68" y="330">timer expiry</text>

  <path d="M80 416 C8 416 8 88 80 88" fill="none" stroke="#5b9bd5" stroke-width="2.5" marker-end="url(#ab)"/>
  <text class="tb" x="2" y="424">Link down or</text>
  <text class="tb" x="2" y="436">admin down</text>

  <!-- DEFAULTED close to the left SM; stack centered in the box -->
  <rect x="390" y="40" width="470" height="500" fill="#fff" stroke="#ed7d31" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text class="t" x="625" y="520" text-anchor="middle" font-size="16" font-weight="700">DEFAULTED</text>

  <rect x="530" y="64" width="190" height="46" fill="#fff" stroke="#548235" stroke-width="2.5" filter="url(#sh)"/>
  <text class="t" x="625" y="83" text-anchor="middle" font-size="14">FALLBACK</text>
  <text class="t" x="625" y="99" text-anchor="middle" font-size="11">Selectable=1</text>

  <path d="M625 138 L735 180 L625 222 L515 180 Z" fill="#fff" stroke="#548235" stroke-width="2.5"/>
  <text class="t" x="625" y="176" text-anchor="middle" font-size="12">Elected member?</text>
  <text class="t" x="625" y="190" text-anchor="middle" font-size="9">lowest actor port id</text>

  <path d="M625 258 L735 304 L625 350 L515 304 Z" fill="#fff" stroke="#548235" stroke-width="2.5"/>
  <text class="t" x="625" y="300" text-anchor="middle" font-size="13">Fallback</text>
  <text class="t" x="625" y="316" text-anchor="middle" font-size="13">Enabled?</text>

  <rect x="530" y="390" width="190" height="52" fill="#fff" stroke="#5b9bd5" stroke-width="2.5" filter="url(#sh)"/>
  <text class="t" x="625" y="421" text-anchor="middle" font-size="13">Selectable=0</text>

  <line x1="625" y1="390" x2="625" y2="352" stroke="#548235" stroke-width="2.5" marker-end="url(#ag)"/>
  <text class="tg" x="634" y="376">Yes</text>
  <line x1="625" y1="258" x2="625" y2="224" stroke="#548235" stroke-width="2.5" marker-end="url(#ag)"/>
  <text class="tg" x="634" y="246">Yes</text>
  <line x1="625" y1="138" x2="625" y2="112" stroke="#548235" stroke-width="2.5" marker-end="url(#ag)"/>
  <text class="tg" x="634" y="130">Yes</text>

  <!-- NO from each diamond back to Selectable=0 -->
  <path d="M735 180 C820 180 820 416 722 416" fill="none" stroke="#548235" stroke-width="2.5" marker-end="url(#ag)"/>
  <text class="tg" x="804" y="210">NO</text>
  <path d="M735 304 C790 304 790 416 722 416" fill="none" stroke="#548235" stroke-width="2.5" marker-end="url(#ag)"/>
  <text class="tg" x="774" y="328">NO</text>

  <line x1="530" y1="87" x2="272" y2="87" stroke="#548235" stroke-width="2.5" marker-end="url(#ag)"/>
  <text class="tg halo" x="428" y="66">Link down or</text>
  <text class="tg halo" x="428" y="78">admin down</text>

  <line x1="530" y1="110" x2="272" y2="400" stroke="#548235" stroke-width="2.5" marker-end="url(#ag)"/>
  <text class="tg" x="412" y="148">received LACPDU</text>

  <line x1="270" y1="233" x2="528" y2="400" stroke="#5b9bd5" stroke-width="2.5" marker-end="url(#ab)"/>
  <text class="tb halo" x="276" y="214">current_while</text>
  <text class="tb halo" x="276" y="226">timer expiry</text>

  <line x1="530" y1="429" x2="272" y2="429" stroke="#5b9bd5" stroke-width="2.5" marker-end="url(#ab)"/>
  <text class="tb" x="392" y="444">received LACPDU</text>

  <line x1="530" y1="390" x2="272" y2="110" stroke="#5b9bd5" stroke-width="2.5" marker-end="url(#ab)"/>
  <text class="tb halo" x="538" y="368">Link down or</text>
  <text class="tb halo" x="538" y="380">admin down</text>
</svg>
